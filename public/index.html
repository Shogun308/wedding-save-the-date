<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will & Beth are Getting Married! | Save the Date</title>
  <link rel="icon" type="image/png" href="couple.jpg">
  <meta name="description" content="Save the Date! Will & Beth are getting married on Sunday, July 18th, 2027 at Highley Manor, West Sussex.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wensley.cloud/">
  <meta property="og:title" content="Will & Beth | Save the Date">
  <meta property="og:description" content="We're getting married! Join us on July 18th, 2027 at Highley Manor.">
  <meta property="og:image" content="couple.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="save-the-date-container">
    <div class="card-wrapper fade-in-up">
      
      <!-- Left side: Photo Panel -->
      <div class="photo-panel">
        <div class="image-wrapper">
          <img src="couple.jpg" alt="Will and Beth" class="couple-photo">
          <div class="photo-overlay"></div>
        </div>
      </div>
      
      <!-- Right side: Content Panel -->
      <div class="content-panel">
        <header class="monogram-header">
          <div class="monogram">W & B</div>
          <p class="subtitle-uppercase">Are Getting Married</p>
        </header>

        <section class="main-details">
          <h1 class="headline">Save the Date</h1>
          
          <div class="date-highlight">
            <span class="day-name">Sunday</span>
            <span class="date-text">18 . 07 . 2027</span>
          </div>

          <div class="divider">
            <span class="divider-leaf">✿</span>
          </div>

          <p class="venue-name">Highley Manor</p>
          <p class="venue-address">Crawley Lane, Balcombe, Haywards Heath, RH17 6LA</p>
        </section>

        <!-- Countdown Timer -->
        <section class="countdown-section">
          <p class="countdown-title">Counting Down the Days</p>
          <div class="countdown-grid" id="countdown">
            <div class="countdown-item">
              <span class="number" id="days">00</span>
              <span class="label">Days</span>
            </div>
            <div class="countdown-item">
              <span class="number" id="hours">00</span>
              <span class="label">Hours</span>
            </div>
            <div class="countdown-item">
              <span class="number" id="minutes">00</span>
              <span class="label">Mins</span>
            </div>
            <div class="countdown-item">
              <span class="number" id="seconds">00</span>
              <span class="label">Secs</span>
            </div>
          </div>
        </section>

        <!-- Action Area -->
        <footer class="action-footer">
          <p class="rsvp-notice">Formal invitation to follow</p>
        </footer>
      </div>

    </div>
  </main>

  <footer class="global-footer">
    <p>Made by me for our wedding.</p>
  </footer>

  <!-- Logic -->
  <script src="app.js"></script>
</body>
</html>
